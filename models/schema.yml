version: 2

sources:
  - name: raw
    database: benja-project
    schema: gz_raw_data
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: sales of Greenweez / we have one row per product_id found in each orders_id
        tests:
          - unique:
              column_name: "(orders_id || '-'  || pdt_id)"
        columns:
          - name: date_date
            description: date of purchase
          - name: orders_id
            description: foreign key to ship
      - name: product
        identifier: raw_gz_product
        description: products of Greenweez
        columns:
          - name: products_id
            description: Primary key
            tests:
            - unique
            - not_null
      - name: ship
        description: shipping data for Greenweez orders
        identifier: raw_gz_ship
        columns:
          - name: orders_id
            description: Primary key
            tests:
            - unique
            - not_null
      - name: adwords
        description: adwords data for Greenweez orders
        identifier: raw_gz_adwords
        tests:
          - unique:
              column_name: "(date_date || '-' || campaign_key)"
      - name: bing
        description: bing data for Greenweez orders
        identifier: raw_gz_bing
        tests:
          - unique:
              column_name: "(date_date || '-' || campaign_key)"
      - name: criteo
        description: criteo data for Greenweez orders
        identifier: raw_gz_criteo
        tests:
          - unique:
              column_name: "(date_date || '-' || campaign_key)"
      - name: facebook
        description: facebook for Greenweez orders
        identifier: raw_gz_facebook
        tests:
          - unique:
              column_name: "(date_date || '-' || campaign_key)"

models:     
    - name: int_campaigns_day
      description: campaign by day
      tests:
      - unique:
          column_name: date_date
      - not_null:
           column_name: date_date